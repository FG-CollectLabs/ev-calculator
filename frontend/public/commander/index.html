<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Commander — EV Calculator</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo">EV Calculator</a>
    <nav>
      <a href="/commander/">Magic Commander</a>
      <a href="/about/">About</a>
    </nav>
  </header>
  <main class="container">
    
<h1>Magic Commander</h1>
<p class="subtle">Buy a case → compare sealing-and-flipping each deck vs. cracking for singles. All prices after TCGPlayer fees.</p>

<table id="displays" class="data">
  <thead>
    <tr>
      <th>Display</th>
      <th class="right">Decks</th>
      <th class="right" title="What you pay to acquire the sealed case (market price). Used as the buy-side cost for delta calculations.">Case cost</th>
      <th class="right" title="Total card value across all decks after selling singles and applying TCGPlayer Direct fees. Assumes you sell every card above the low-value floor.">Singles net</th>
      <th class="right" title="Revenue if you resell each sealed deck individually on the secondary market, after applying sell fees.">Sealed decks net</th>
      <th class="right" title="Best scenario net revenue minus case cost. Positive = profitable flip.">Best delta</th>
      <th class="right" title="Best delta as a percentage of case cost.">%</th>
      <th title="Whether selling sealed decks or cracking for singles produces a higher net return.">Best scenario</th>
    </tr>
  </thead>
  <tbody><tr><td colspan="8" class="loading">Loading…</td></tr></tbody>
</table>

  </main>
  <script>
    window.EV_API_BASE = "http:\/\/localhost:8081";
  </script>
  <script src="/js/fmt.js"></script>
  
<script src="/js/commander-list.js"></script>

</body>
</html>
